    <script>
      (function() {
        try {
          var targetWindow = typeof window !== 'undefined' ? window : null;
          if (!targetWindow) return;
          var nativeFetch = targetWindow.fetch;
          var customFetch = nativeFetch ? nativeFetch.bind(targetWindow) : null;

          // Provide getter and setter on Window.prototype so any extension
          // doing `window.fetch = ...` never throws "only has a getter" TypeError
          var winProto = typeof Window !== 'undefined' ? Window.prototype : null;
          if (winProto) {
            try {
              Object.defineProperty(winProto, 'fetch', {
                get: function() {
                  return customFetch || nativeFetch;
                },
                set: function(fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {}
          }

          // Also define getter/setter directly on window instance
          try {
            Object.defineProperty(targetWindow, 'fetch', {
              get: function() {
                return customFetch || nativeFetch;
              },
              set: function(fn) {
                customFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        } catch (e) {}
      })();
    </script>
